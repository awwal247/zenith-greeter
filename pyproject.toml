[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zenith-greeter"
version = "0.1.0"
description = "A small example Python package with a reusable Greeter class"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Zenith OX" }]
keywords = ["greeting", "example", "zenith"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["src"]
